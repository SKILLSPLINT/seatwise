server:
  port: 9092

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/eventdb
    username: jodos
    password: jodos2006
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
logging:
  level:
    root: INFO
    org.springframework: INFO
# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0
      environment: dev
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
seat:
  release:
    interval: 1800000 #cron job run every 30 minutes
    timeout: 1800 # seat expires after 30 min
services:
  file-service:
    url: http://FILE-SERVICE