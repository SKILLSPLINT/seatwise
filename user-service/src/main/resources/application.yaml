server:
  port: 9091

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: jodos
    password: jodos2006
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# Admin Configuration
admin:
  secret-key: ${ADMIN_SECRET_KEY:default-admin-secret-key-change-in-production}

# Service Discovery URLs (using Eureka load-balanced URLs)
services:
  file-service:
    url: http://FILE-SERVICE

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.seatwise: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true #user ip address
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0.0
      environment: dev
    lease-renewal-interval-in-seconds: 15 #ping 15 secs
    lease-expiration-duration-in-seconds: 45 # no response in this timme service put down

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus #endpoints to expose for health check
  endpoint:
    health:
      show-details: always