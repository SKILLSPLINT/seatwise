server:
  port: 9096
spring:
  application:
    name: payment-service
  datasource:
    url:  jdbc:postgresql://localhost:5432/paymentdb
    username: jodos
    password: jodos2006
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    username: admin
    password: admin123
    host: localhost
    port: 5672
    template:
      mandatory: true
      receive-timeout: 50000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 3
          multiplier: 2
        acknowledge-mode: auto
logging:
  level:
    root: INFO
    org.springframework: INFO
services:
  booking-service:
    url: http://BOOKING-SERVICE
  notification-service:
    url: http://NOTIFICATION-SERVICE
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0
      environment: dev
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always