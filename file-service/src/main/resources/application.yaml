server:
  port: 9095

spring:
  application:
    name: file-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  config:
    import: "optional:file:.env"

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket-name: ${MINIO_BUCKET_NAME:seatwise-files}
  presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:3600}

# File Upload Configuration
file:
  allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  max-size-mb: 50
  categories: profile,documents,events,tickets,receipts

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.seatwise: DEBUG
    io.minio: DEBUG

# Eureka Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0.0
      environment: dev
    lease-renewal-interval-in-seconds: 15
    lease-expiration-duration-in-seconds: 45

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# OpenAPI/Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
