server:
  port: 9095
spring:
  application:
    name: file-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.seatwise: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true #user ip address
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0.0
      environment: dev
    lease-renewal-interval-in-seconds: 15 #ping 15 secs
    lease-expiration-duration-in-seconds: 45 # no response in this timme service put down

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus #endpoints to expose for health check
  endpoint:
    health:
      show-details: always