services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9002:9002"
    env_file:
      - .env
    volumes:
      - ${MINIO_STORAGE_PATH}:/data
    command: server /data --console-address ":9002"
networks:
  seatwise:
    external: true