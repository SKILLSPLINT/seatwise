server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # API Routes
            - id: user-service
              uri: lb://USER-SERVICE
              predicates:
                - Path=/api/v1/auth/**
            - id: event-service
              uri: lb://EVENT-SERVICE
              predicates:
                - Path=/api/v1/events/**
            - id: file-service
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/api/v1/files/**
            # Swagger/OpenAPI Routes for each service
            - id: user-service-api-docs
              uri: lb://USER-SERVICE
              predicates:
                - Path=/user-service/api-docs/**
              filters:
                - RewritePath=/user-service/api-docs(?<segment>.*), /api-docs${segment}
            - id: event-service-api-docs
              uri: lb://EVENT-SERVICE
              predicates:
                - Path=/event-service/api-docs/**
              filters:
                - RewritePath=/event-service/api-docs(?<segment>.*), /api-docs${segment}
            - id: file-service-api-docs
              uri: lb://FILE-SERVICE
              predicates:
                - Path=/file-service/api-docs/**
              filters:
                - RewritePath=/file-service/api-docs(?<segment>.*), /api-docs${segment}
            - id: booking-service-api-docs
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/booking-service/api-docs/**
              filters:
                - RewritePath=/booking-service/api-docs(?<segment>.*), /api-docs${segment}
            - id: notification-service-api-docs
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notification-service/api-docs/**
              filters:
                - RewritePath=/notification-service/api-docs(?<segment>.*), /api-docs${segment}

# Springdoc OpenAPI Configuration - Aggregated Swagger UI
springdoc:
  swagger-ui:
    urls:
      - name: User Service
        url: /user-service/api-docs
      - name: Event Service
        url: /event-service/api-docs
      - name: File Service
        url: /file-service/api-docs
      - name: Booking Service
        url: /booking-service/api-docs
      - name: Notification Service
        url: /notification-service/api-docs

logging:
  level:
    root: INFO
    org.springframework: INFO
    com.seatwise: DEBUG
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true #user ip address
    instance-id: ${spring.application.name}-${server.port}
    metadata-map:
      version: 1.0.0
      environment: dev
    lease-renewal-interval-in-seconds: 15 #ping 15 secs
    lease-expiration-duration-in-seconds: 45 # no response in this timme service put down

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted