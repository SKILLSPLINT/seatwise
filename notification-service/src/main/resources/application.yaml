server:
  port: 9093

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notificationdb
    username: jodos
    password: jodos2006
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    username: admin
    password: admin123
    host: localhost
    port: 5672
    template:
      mandatory: true
      receive-timeout: 50000
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-retries: 3
          multiplier: 2
        acknowledge-mode: auto
# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

logging:
  level:
    root: INFO
    org.springframework: INFO
